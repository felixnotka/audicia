apiVersion: v2
name: audicia-operator
description: Automated RBAC policy generation for Kubernetes
type: application
# The release pipeline packages the chart with --version / --app-version, so
# these values never reach a published artifact. They exist so that a local
# helm template or helm lint renders the current release line rather than a
# number that was last true several releases ago.
version: 0.5.2
appVersion: "0.5.2"
kubeVersion: ">=1.32.0-0"
home: https://audicia.io
sources:
  - https://github.com/felixnotka/audicia
keywords:
  - kubernetes
  - rbac
  - security
  - audit
  - operator
  - policy
maintainers:
  - name: Felix Notka
    url: https://github.com/felixnotka
