name: pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write
  pull-requests: read

jobs:
  determine-version:
    uses: ./.github/workflows/determine-version.yaml

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      operator: ${{ steps.filter.outputs.operator }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # The branch tip before this push, so a push carrying several
            # commits is judged by everything it brought. HEAD~1 sees only the
            # last commit, which silently hides changes made in any earlier one.
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] ||
               [ "$BASE" = "0000000000000000000000000000000000000000" ] ||
               ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              # New branch, or a history rewrite that dropped the old tip.
              BASE="HEAD~1"
            fi
          else
            # PR: compare against the base branch
            BASE="origin/${{ github.base_ref }}"
          fi
          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          if echo "$CHANGED" | grep -qE '^(operator/|deploy/helm/)'; then
            echo "operator=true" >> "$GITHUB_OUTPUT"
          else
            echo "operator=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^site/'; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
          fi

  site-check:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.site == 'true'
    uses: ./.github/workflows/site-check.yaml

  lint-and-test:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.operator == 'true'
    uses: ./.github/workflows/lint-and-test.yaml
    secrets: inherit

  docker-build-and-push:
    needs: [determine-version, detect-changes, lint-and-test]
    if: needs.detect-changes.outputs.operator == 'true'
    uses: ./.github/workflows/docker-build-and-push.yaml
    secrets: inherit
    with:
      new_version: ${{ needs.determine-version.outputs.new_version }}
      environment: ${{ needs.determine-version.outputs.environment }}

  site-build-and-push:
    needs: [determine-version, detect-changes, site-check, docker-build-and-push]
    # Always run unless a prior required job actually failed or was cancelled.
    # Skipped operator jobs (no operator changes) are fine — the site must
    # rebuild on every push regardless.
    if: >-
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/site-build-and-push.yaml
    secrets: inherit
    with:
      new_version: ${{ needs.determine-version.outputs.new_version }}
      environment: ${{ needs.determine-version.outputs.environment }}
      operator_changed: ${{ needs.detect-changes.outputs.operator == 'true' }}
